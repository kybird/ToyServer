version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: game_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: game
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  mongo:
    image: mongo:latest
    container_name: game_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:latest
    container_name: game_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  mongo_data:
  redis_data:
